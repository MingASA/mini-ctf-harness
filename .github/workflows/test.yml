name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: offline_harness/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: offline_harness
      - run: npm test
        working-directory: offline_harness
      - run: python3 -m unittest discover -s installer/test
      - run: ./mini-ctf install --plan
